server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Anh avatar toi da 2MB (backend gioi han 3MB cho ca request)
    client_max_body_size 5m;

    # Kenh SSE thong bao tuc thi: tat buffering, giu ket noi dai (phai dat TRUOC location /api/)
    location /api/notifications/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Chuyen tiep API sang backend (ten "backend" la ten service trong docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        # Giu nguyen Host (kem cong) de backend thay dung origin cua trinh duyet
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File build co hash trong ten -> cache dai han
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: moi duong dan khac tra ve index.html (vd /admin/orders, /payment-result)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
