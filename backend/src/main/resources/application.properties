spring.application.name=Sport E-Commerce

# ===== Database =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# In SQL ra console làm chậm mỗi request đáng kể -> mặc định TẮT; bật khi debug: JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# ===== Connection pool (HikariCP) - DB Neon ở xa, kết nối nhàn rỗi bị Neon đóng sau vài phút =====
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:60000}

# ===== Cache (Caffeine, trong bộ nhớ) =====
app.cache.catalog-ttl-seconds=${CACHE_CATALOG_TTL_SECONDS:120}
app.cache.coupon-ttl-seconds=${CACHE_COUPON_TTL_SECONDS:30}
app.cache.product-ttl-seconds=${CACHE_PRODUCT_TTL_SECONDS:30}

# ===== Phiên đăng nhập: số thiết bị tối đa mỗi vai trò (đăng nhập thêm -> đá phiên cũ nhất) =====
app.session.max-admin=${SESSION_MAX_ADMIN:1}
app.session.max-staff=${SESSION_MAX_STAFF:2}
app.session.max-customer=${SESSION_MAX_CUSTOMER:5}
# Thời gian cache principal trong JWT filter (giảm 1 truy vấn DB/request); khóa/đổi vai trò có hiệu lực tối đa sau chừng này giây (đã evict chủ động khi khóa/đổi mật khẩu)
app.auth.principal-cache-ttl-seconds=${AUTH_PRINCIPAL_CACHE_TTL_SECONDS:10}

# ===== Đơn hàng: tự hủy đơn chưa thanh toán quá hạn =====
app.order.unpaid-expire-minutes=${ORDER_UNPAID_EXPIRE_MINUTES:1440}
app.order.expire-scan-ms=${ORDER_EXPIRE_SCAN_MS:60000}
app.order.expire-initial-delay-ms=${ORDER_EXPIRE_INITIAL_DELAY_MS:60000}

# ===== SSE thông báo tức thì =====
app.sse.timeout-ms=${SSE_TIMEOUT_MS:600000}
app.sse.heartbeat-ms=${SSE_HEARTBEAT_MS:25000}
app.sse.max-connections-per-user=${SSE_MAX_CONNECTIONS_PER_USER:5}

# ===== Actuator / Micrometer / Prometheus =====
# /actuator/health công khai; các endpoint còn lại yêu cầu JWT của ADMIN (xem SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# Health chỉ phản ánh DB/Redis; không ping SMTP (Gmail) vì sẽ làm /health DOWN khi mail chậm
management.health.mail.enabled=false
management.endpoint.prometheus.enabled=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# ===== API Giao Hàng Nhanh (GHN) =====
shipping.cancel-order=${SHIPPING_CANCEL_ORDER:true}
shipping.ghn.base-url=${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
shipping.ghn.token=${GHN_TOKEN}
shipping.ghn.shop-id=${GHN_SHOP_ID}
shipping.ghn.from-district-id=${GHN_FROM_DISTRICT_ID:1461}

# ===== API Giao Hàng Tiết Kiệm (GHTK) =====
shipping.ghtk.base-url=${GHTK_BASE_URL:https://services.giaohangtietkiem.vn}
shipping.ghtk.token=${GHTK_TOKEN}
shipping.ghtk.pick-province=${GHTK_PICK_PROVINCE:Hồ Chí Minh}
shipping.ghtk.pick-district=${GHTK_PICK_DISTRICT:Quận Gò Vấp}
shipping.ghtk.pick-ward=${GHTK_PICK_WARD:Phường 1}
shipping.ghtk.pick-address=${GHTK_PICK_ADDRESS:12 Nguyễn Văn Bảo}
shipping.ghtk.pick-tel=${GHTK_PICK_TEL:0123456789}

# ===== JWT =====
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# ===== Redis (OTP cache) =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}

# ===== OTP =====
app.otp.length=${OTP_LENGTH:6}
app.otp.ttl-seconds=${OTP_TTL_SECONDS:86400}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# ===== Mail =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:chitoanphan8505@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Delta Sport}

# ===== Upload ảnh =====
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ===== Lưu trữ ảnh (Cloudinary) =====
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.cloudinary.folder=${CLOUDINARY_FOLDER:delta-sport}

# ===== VNPay =====
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment-result}
