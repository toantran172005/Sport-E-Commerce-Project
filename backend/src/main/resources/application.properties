spring.application.name=Sport E-Commerce

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.exrunkqnaxuwnvpczumz
spring.datasource.password=sapasswordfitiuh
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ===== JWT =====
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ===== Redis (OTP cache) =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===== OTP =====
app.otp.length=6
app.otp.ttl-seconds=120
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ===== Mail =====
# Dang dung Mailtrap Email Sandbox de test (email khong gui that ra ngoai, duoc "bat"
# lai trong hop thu ao tren mailtrap.io de xem noi dung OTP). Khi nao san sang gui that,
# doi sang Brevo (hoac provider khac) chi bang cach set lai MAIL_HOST/MAIL_PORT/
# MAIL_USERNAME/MAIL_PASSWORD, khong can sua code:
#   Brevo:    MAIL_HOST=smtp-relay.brevo.com   MAIL_PORT=587
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:no-reply@sportecommerce.com}
app.mail.from-name=Sport E-Commerce
